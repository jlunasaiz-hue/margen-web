name: Publicar ZARVIQO en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Comprobar funcionamiento
        run: npm run check
      - name: Preparar archivos publicos
        run: npm run build:pages
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir web publica
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar código para validación
        uses: actions/checkout@v4
      - name: Preparar Node.js para validación
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Publicar web
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Comprobar URL publicada
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/public-smoke.mjs "$PUBLIC_URL"
